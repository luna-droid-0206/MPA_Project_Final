{% extends "base.html" %}

{% block title %}Page Not Found - SimCLR Web App{% endblock %}

{% block content %}
<div class="container-lg py-5">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="error-page text-center">
                <div class="error-icon mb-4">
                    <i class="bi bi-exclamation-triangle" style="font-size: 5rem; color: #ffc107;"></i>
                </div>
                <h1 class="display-1 fw-bold mb-2">404</h1>
                <h3 class="mb-3">Page Not Found</h3>
                <p class="text-muted mb-4">
                    Sorry, the page you're looking for doesn't exist or has been moved.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house"></i> Back to Home
                    </a>
                    <a href="/documentation" class="btn btn-outline-primary btn-lg">
                        <i class="bi bi-book"></i> Documentation
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .error-page {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
</style>
{% endblock %}
